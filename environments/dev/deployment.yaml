apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-config
  labels:
    app.kubernetes.io/name: platform-config
spec:
  replicas: 1
  progressDeadlineSeconds: 60
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-config
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-config
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9898"
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.13.0
          env:
            - name: PODINFO_UI_MESSAGE
              value: from-the-config-repo
          ports:
            - name: http
              containerPort: 9898
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9898
            periodSeconds: 2
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
